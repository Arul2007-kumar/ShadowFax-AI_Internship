[project]
name = "documind-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "google-genai>=2.19.0",
    "langchain-text-splitters>=1.1.2",
    "pymupdf>=1.28.2",
    "recursivecharactertextsplitter>=0.1.0",
]

[project.scripts]
documind-ai = "documind_ai:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
